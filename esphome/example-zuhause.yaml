# Cheap Yellow Companion – example device, profile "home" (local MQTT broker + Home Assistant).
# Copy next to the cloned repo (…/esphome/example-zuhause.yaml), adjust substitutions, put the secrets in secrets.yaml.
# Away from home: replace the zuhause package with yellow-unterwegs.yaml and set mqtt_broker to your public broker (TLS).
substitutions:
  name: yellow
  friendly_name: Yellow
  geraet: yellow # MQTT topics yellow/<geraet>/…, also the MQTT user if your broker uses per-device ACLs
  mqtt_user: yellow
  mqtt_passwort: !secret yellow_mqtt_password
  mqtt_broker: 192.168.1.10 # your broker
  person: "" # owner's name for the greeting, e.g. "Anna"
  figur_name: Yellow
  figur_fest: "" # Okti, Fuchs or Roboter to fix the character, empty = selectable
  farbe_tag: "0xE8E8E8"
  farbe_tag_2: "0x8A8A8A"
  farbe_nacht: "0xC25A00"
  farbe_nacht_2: "0x6A3200"
  ldr_dunkel: "0.5" # volts at the light sensor above which the room counts as dark
  drehung: "90" # landscape; picture upside down: 270

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0

logger:
  level: DEBUG
  initial_level: WARN

api:
  encryption:
    key: !secret yellow_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      id: neustartgrund # telemetry reads it
      name: Restart reason

packages:
  board: !include cheap-yellow-companion/esphome/board-cyd.yaml
  yellow: !include cheap-yellow-companion/esphome/yellow-basis.yaml
  mqtt: !include cheap-yellow-companion/esphome/yellow-mqtt.yaml
  zuhause: !include cheap-yellow-companion/esphome/yellow-zuhause.yaml
  # nabu: !include cheap-yellow-companion/esphome/yellow-nabu.yaml # optional, with a voice assistant
