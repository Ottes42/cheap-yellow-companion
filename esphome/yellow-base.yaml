lvgl:
  displays: [tft]
  rotation: ${rotation}
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 1200ms
  buffer_size: 25%
  default_font: font_text
  pages:
    - id: main_page
      bg_color: 0x000000
      scrollable: false
      widgets:
        - label: # boot screen until the character is there (no clock picture first); random text at boot
            id: boot_text
            align: CENTER
            text: "${t_boot}"
            text_color: 0x8A93A6
        - obj: # surface for taps / long press, everything else lies inside (yellow.h builds Yellow in here)
            id: surface
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            on_press:
              - lambda: |-
                  id(was_on_before) = id(backlight).current_values.is_on();
                  lv_point_t p;
                  lv_indev_get_point(lv_indev_get_act(), &p);
                  id(tap_top_right) = p.x > 240 && p.y < 44;
                  id(tap_help) = p.x > 284 && p.y > 200;
                  id(tap_network) = p.x > 262 && p.x <= 284 && p.y > 200;
                  id(tap_games) = p.x < 30 && p.y > 200;
                  id(tap_y) = p.y;
              - script.execute: wake_display
            on_long_press: # hold Yellow → the clock's info as signs
              - if:
                  condition:
                    lambda: return yellow::companion.is_visible() && !yellow::companion.petting() && !yellow::companion.help_open();
                  then:
                    - script.execute: show_day_info
            on_short_click:
              - if:
                  condition:
                    lambda: return id(was_on_before) && !yellow::companion.petting() && yellow::companion.is_visible();
                  then:
                    - lambda: |-
                        // "?" opens the help, any tap closes it; small clock → 15 s clock (owner); otherwise poke
                        if (yellow::companion.games_open()) {
                          yellow::companion.games_tap(id(tap_y));
                        } else if (id(tap_network) && yellow::companion.network_level() == 1) {
                          id(open_wifi).execute();
                        } else if (yellow::companion.help_open() || id(tap_help)) {
                          yellow::companion.help(!yellow::companion.help_open());
                        } else if (id(tap_games)) {
                          yellow::companion.games_menu(true);
                        } else if (id(tap_top_right)) {
                          id(clock_until) = millis() + 15000;
                          id(view).execute();
                        } else {
                          yellow::companion.poke();
                        }
            widgets:
              - obj: # clock view (landscape 320×240)
                  id: clock_view
                  width: 100%
                  height: 100%
                  hidden: true # only the view logic shows the clock (at boot Yellow greets)
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        id: lbl_clock
                        align: TOP_MID
                        y: 2
                        text: "--:--"
                        recolor: true
                        text_font: font_clock
                        text_color: ${color_day}
                    - label:
                        id: lbl_date
                        x: 10
                        y: 90
                        width: 104
                        long_mode: DOT
                        text: ""
                        text_color: ${color_day_2}
                    - label:
                        id: z_climate
                        align: TOP_RIGHT
                        x: -10
                        y: 90
                        width: 200
                        long_mode: DOT
                        text_align: RIGHT
                        text: ""
                        text_color: ${color_day_2}
                    - obj: # info rows
                        id: rows
                        x: 14
                        y: 124
                        width: 292
                        height: 112
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        scrollable: false
                        text_color: ${color_day}
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          pad_row: 6
                        widgets:
                          - label: { id: z_alarm, width: 100%, long_mode: DOT, text: "", hidden: true }
                          - label: { id: z_appointment, width: 100%, long_mode: DOT, text: "", hidden: true }
                          - label: { id: z_weather, width: 100%, long_mode: DOT, text: "", hidden: true }
                          - label: { id: z_notice, width: 100%, long_mode: DOT, text: "", hidden: true, text_color: 0xFF6B3D }
              - obj: # assist: what was said and what comes back
                  id: assist
                  x: 8
                  y: 118
                  width: 304
                  height: 116
                  hidden: true
                  clickable: false
                  scrollable: false
                  bg_color: 0x0E1622
                  border_width: 0
                  radius: 12
                  pad_all: 10
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 6
                  widgets:
                    - label:
                        id: lbl_in
                        width: 100%
                        long_mode: DOT
                        max_height: 24
                        text: ""
                        text_color: 0xE8E8E8
                    - label:
                        id: lbl_out
                        width: 100%
                        long_mode: DOT
                        max_height: 66
                        text: ""
                        text_color: 0x7FB8FF
              - obj: # Yellow's cardboard sign, yellow.h slides it in from the top
                  id: sign
                  x: 60
                  y: -100
                  width: 200
                  height: 80
                  hidden: true
                  clickable: false
                  scrollable: false
                  bg_color: 0xF4E4C1
                  border_width: 3
                  border_color: 0x8B6B3E
                  radius: 6
                  pad_all: 4
                  widgets:
                    - label:
                        id: sign_text
                        align: CENTER
                        width: 100%
                        long_mode: WRAP
                        text_align: CENTER
                        text_font: font_sign
                        text_color: 0x3A2A18
                        text: ""
              - arc: # only so LVGL builds arcs (eyes and mouth in yellow.h)
                  id: arc_template
                  hidden: true
                  clickable: false
              - label: # only carries the decoration font so yellow.h gets it
                  id: decor_template
                  hidden: true
                  text: ""
                  text_font: font_decor
              - label: # only carries the status line symbols
                  id: status_template
                  hidden: true
                  text: ""
                  text_font: font_status
              - line: # only so LVGL builds lines (Okti's arms in yellow.h)
                  id: line_template
                  hidden: true
                  points:
                    - 0, 0
                    - 1, 1
    - id: wifi_page # Wi-Fi dialog: pick a network, type the password, OK
      bg_color: 0x000000
      scrollable: false
      widgets:
        - dropdown:
            id: wifi_list
            x: 4
            y: 4
            width: 220
            options: ["-"]
            on_press:
              - script.execute: wake_display
            indicator:
              text_font: montserrat_14
        - button:
            x: 230
            y: 4
            width: 86
            height: 40
            on_click:
              - lvgl.page.show: main_page
            widgets:
              - label:
                  align: CENTER
                  text: "${t_back}"
        - textarea:
            id: wifi_password_box
            x: 4
            y: 50
            width: 312
            one_line: true
            placeholder_text: "${t_password}"
            on_ready:
              - script.execute: connect_wifi
        - keyboard:
            id: wifi_keyboard
            textarea: wifi_password_box
            align: BOTTOM_MID
            height: 140
            on_press:
              - script.execute: wake_display
            items:
              text_font: montserrat_14

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_name
      name: ${t_wifi}
      icon: mdi:wifi
  - platform: template
    name: ${t_today} # daily counts taps|pets|games|fist (for the daily summary in HA)
    icon: mdi:counter
    update_interval: 60s
    lambda: return yellow::companion.counts_text();
  # info rows: "-" or empty hides the row

sensor:
  - platform: template
    name: ${t_waiting}
    icon: mdi:email-alert-outline
    accuracy_decimals: 0
    update_interval: 2s
    lambda: return yellow::companion.waiting();
    filters:
      - delta: 0.5
  - platform: debug # watch the memory (because of the hangs)
    free:
      name: ${t_free_mem}
      entity_category: diagnostic
    block:
      name: ${t_largest_block}
      state_topic: yellow/${device}/sensor/largest_free_block/state # fixed topic: the umlaut in the German name would give gr____ter_…
      entity_category: diagnostic

binary_sensor:
  - platform: template
    id: yellow_visible
    name: ${t_visible}
    icon: mdi:emoticon-happy-outline
    lambda: return yellow::companion.is_visible();
