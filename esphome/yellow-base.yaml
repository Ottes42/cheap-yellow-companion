# Settings (can be overridden in the device file): empty = free or set on the device later
substitutions:
  person: "" # owner's display name, e.g. for the greeting ("Hello Anna!")
  companion_name: Yellow # what the character calls itself
  fixed_character: "" # burn in Okti, Fox or Robot (option text of the chosen language; empty = selectable via "Character")
  yellow_path: cheap-yellow-companion/esphome # folder of these files, relative to the device file
  internet_check_url: http://connectivitycheck.gstatic.com/generate_204 # any HTTP answer counts as "internet is there"
  language: en # on-screen texts and entity names: en or de (lang/<language>.h and .yaml)

packages:
  lang: !include lang/${language}.yaml # entity names and YAML texts of the language

# Yellow – base (every profile): character (yellow.h), display, touch, sign, clock view, sliders, switches, games.
# Expects these data sources (IDs) from the profile: ha_time, ha_weather, ha_weather_condition, ha_appointment, ha_alarm,
# ha_notice, climate_temp, climate_humidity, outdoor_temp, doorbell_event, ha_occasion. Profile "home": yellow-home.yaml (HA).

esphome:
  includes: # core yellow.h, topics in their own headers (yellow.h includes them)
    - ${yellow_path}/lang/${language}.h
    - ${yellow_path}/yellow_data.h
    - ${yellow_path}/yellow.h
    - ${yellow_path}/yellow_games.h
    - ${yellow_path}/yellow_special.h
    - ${yellow_path}/yellow_decor.h
    - ${yellow_path}/yellow_body.h
    - ${yellow_path}/yellow_post.h
  on_boot:
    - priority: 200 # LVGL is up: random phrase on the boot screen
      then:
        - lambda: |-
            static const char *const phrase[] = {yellow::txt::BOOT_1, yellow::txt::BOOT_2, yellow::txt::BOOT_3, yellow::txt::BOOT_4,
                                               yellow::txt::BOOT_5, yellow::txt::BOOT_6, yellow::txt::BOOT_7, yellow::txt::BOOT_8};
            lv_label_set_text(id(boot_text), phrase[esphome::random_uint32() % 8]);
    - priority: -100
      then:
      - lambda: |-
          if (!std::string("${fixed_character}").empty()) id(character).publish_state("${fixed_character}");  // fixed at build time
          yellow::companion.kind((yellow::Kind) id(character).active_index().value_or(0));
          yellow::companion.mood((int) id(yellow_mood).state);
          yellow::companion.tension((int) id(yellow_tension).state);
          yellow::companion.energy((int) id(yellow_energy).state);
          yellow::companion.decor_font(lv_obj_get_style_text_font(id(decor_template), LV_PART_MAIN));
          yellow::companion.status_font(lv_obj_get_style_text_font(id(status_template), LV_PART_MAIN));
          yellow::companion.digit_font(lv_obj_get_style_text_font(id(lbl_clock), LV_PART_MAIN));
          yellow::companion.build(id(surface), id(sign), id(sign_text));
          lv_obj_add_flag(id(boot_text), LV_OBJ_FLAG_HIDDEN);
          wifi::global_wifi_component->set_keep_scan_results(true);  // network list for the Wi-Fi dialog
          yellow::companion.decor(id(decor_mode).active_index().value_or(0));
          yellow::companion.remote_sayings(id(sayings_saved).data());
          // events as JSON to yellow/<device>/event (same way at home and on the go)
          static auto event = [](const char *type, const std::string &text, const std::string &game, int value) {
            id(log_activity).execute(game.empty() ? std::string(type) : std::string(type) + " " + game + " " + to_string(value));
            if (mqtt::global_mqtt_client == nullptr || !mqtt::global_mqtt_client->is_connected()) return;
            mqtt::global_mqtt_client->publish_json("yellow/${device}/event", [=](JsonObject root) {
              root["type"] = type;
              if (!text.empty()) root["text"] = text;
              if (!game.empty()) { root["game"] = game; root["value"] = value; }
            });
          };
          yellow::companion.timer_off = []() {
            event("timer_off", "", "", 0);
          };
          yellow::companion.woke_up = []() {
            id(yellow_sleep).publish_state(false);
            id(log_activity).execute(std::string("woke_up"));
          };
          yellow::companion.first_tap = []() -> bool {  // greeting on the first tap from 05:00, once a day
            auto t = id(ha_time).now();
            if (!t.is_valid() || t.hour < 5 || id(greeted_day) == t.day_of_year) return false;
            id(greeted_day) = t.day_of_year;
            auto good = [](const std::string &x) { return !x.empty() && x != "-" && x != "unknown" && x != "unavailable"; };
            const std::string person = "${person}";
            std::string g = t.hour >= 11 ? yellow::txt::HI_THERE : yellow::txt::GOOD_MORNING;
            if (!person.empty()) g += ", " + person;
            g += std::string("!\n") + yellow::txt::WEEKDAY_LINE[t.day_of_week - 1];
            if (good(id(ha_weather).state)) g += "\n" + id(ha_weather).state;
            if (good(id(ha_greeting).state)) g += "\n" + id(ha_greeting).state;
            yellow::companion.message(g, false, 3);
            return true;
          };
          yellow::companion.petted = [](const std::string &sign) {
            event("petted", sign, "", 0);
          };
          yellow::companion.game_over = [](const std::string &game, int value) {
            event("game", "", game, value);
            id(store_record).execute(game, value);
          };
          yellow::companion.answer = [](const std::string &a) {
            event("answer", a.empty() ? std::string(yellow::txt::NO_ANSWER) : a, "", 0);
          };
          yellow::companion.read = [](const std::string &t) {
            event("read", t, "", 0);
          };
          yellow::companion.led = [](uint32_t rgb, float bright) {
            if (bright <= 0) {
              auto call = id(status_led).turn_off();
              call.set_transition_length(600);
              call.perform();
              return;
            }
            auto call = id(status_led).turn_on();
            call.set_rgb(((rgb >> 16) & 0xFF) / 255.0f, ((rgb >> 8) & 0xFF) / 255.0f, (rgb & 0xFF) / 255.0f);
            call.set_brightness(bright);
            call.set_transition_length(150);
            call.perform();
          };
      - script.execute: view
      - delay: 1500ms # greeting after boot (not in the dark, Yellow is invisible then)
      - lambda: |-
          yellow::companion.gesture("wave");
          const std::string person = "${person}", companion_name = "${companion_name}";
          if (person.empty()) yellow::companion.show_sign(yellow::txt::HELLO, 5);
          else yellow::companion.message(str_sprintf(yellow::txt::GREETING_FMT, person.c_str(), companion_name.c_str()), false, 3);

globals:
  - id: dark_test # command dark_test: the view treats the room as dark (backlight unchanged)
    type: bool
    initial_value: "false"
  - id: best_reaction_ms # device records, written only when beaten
    type: int
    restore_value: true
    initial_value: "0"
  - id: best_simon
    type: int
    restore_value: true
    initial_value: "0"
  - id: greeted_day # day of the year of the last first-tap greeting (kept over reboots: one greeting a day)
    type: int
    restore_value: true
    initial_value: "-1"
  - id: network_test # command network_test: only show a network level (1 Wi-Fi, 2 MQTT, 3 internet; 0 = real)
    type: int
    initial_value: "0"
  - id: internet_ok # result of the last internet check (only checked while MQTT is disconnected)
    type: bool
    initial_value: "true"
  - id: awake_until
    type: uint32_t
    initial_value: "0"
  - id: night_colors
    type: int
    initial_value: "-1"
  - id: was_on_before # display was already on when tapped (otherwise just wake it)
    type: bool
    initial_value: "true"
  - id: tap_top_right # press on the small clock next to Yellow
    type: bool
    initial_value: "false"
  - id: tap_help # press on the "?" bottom right
    type: bool
    initial_value: "false"
  - id: activity_log # activity log "HH:MM what" until the next telemetry (at most 30 entries)
    type: std::vector<std::string>
  - id: sayings_saved # remote sayings list, saved locally for reboots without network
    type: std::array<char, 600>
    restore_value: true
  - id: tap_games # press on the games icon bottom left
    type: bool
    initial_value: "false"
  - id: tap_y # y of the last press (games menu)
    type: int
    initial_value: "0"
  - id: tap_network # press on the network icon left of the "?"
    type: bool
    initial_value: "false"
  - id: clock_until # clock instead of Yellow until then (after tapping the small clock)
    type: uint32_t
    initial_value: "0"

switch:
  - platform: template
    id: off_at_night
    name: ${t_off_at_night}
    icon: mdi:power-sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: yellow_sleep # put Yellow to sleep (also by voice via the voice assistant); tapping wakes him
    name: ${t_sleeps}
    state_topic: yellow/${device}/switch/yellow_sleeps/state # fixed topic: an umlaut in the German name would give yellow_schl__ft
    command_topic: yellow/${device}/switch/yellow_sleeps/command
    icon: mdi:sleep
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: yellow::companion.sleep(true);
    turn_off_action:
      - lambda: yellow::companion.sleep(false);
  - platform: template
    id: wake_mode # HA switches it on for the sunrise alarm: Yellow may then be visible in the dark too
    name: ${t_wake_mode}
    icon: mdi:weather-sunset-up
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    turn_on_action: # the state is set only after the action, so wait briefly
      - delay: 50ms
      - script.execute: view
    turn_off_action:
      - delay: 50ms
      - script.execute: view
  - platform: template
    id: auto_brightness
    name: ${t_auto_brightness}
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

number:
  - platform: template # Yellow's mood: 0 yellow and happy … 100 red and grumpy (mouth corners down, brows)
    id: yellow_mood
    name: ${t_mood}
    icon: mdi:emoticon-angry-outline
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    on_value:
      - lambda: yellow::companion.mood((int) x);
  - platform: template # 0 relaxed … 100 very nervous (pace, blinking, sweat, flinching); HA feeds it automatically
    id: yellow_tension
    name: ${t_tension}
    icon: mdi:heart-pulse
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 20
    on_value:
      - lambda: yellow::companion.tension((int) x);
  - platform: template # 0 dead tired … 100 wide awake (breathing, yawning, boredom); HA feeds it by time of day
    id: yellow_energy
    name: ${t_energy}
    icon: mdi:battery-heart-variant
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 70
    on_value:
      - lambda: yellow::companion.energy((int) x);

button:
  - platform: template
    name: ${t_play_post}
    icon: mdi:email-open-outline
    on_press:
      - lambda: yellow::companion.play_post();
  - platform: template
    name: ${t_reaction}
    icon: mdi:timer-play-outline
    on_press:
      - lambda: yellow::companion.game("reaction");
  - platform: template
    name: ${t_ttt}
    icon: mdi:grid
    on_press:
      - lambda: yellow::companion.game("ttt");
  - platform: template
    name: ${t_simon}
    icon: mdi:palette-swatch-outline
    on_press:
      - lambda: yellow::companion.game("simon");
  - platform: template
    name: ${t_cancel_question}
    icon: mdi:comment-remove-outline
    on_press:
      - lambda: yellow::companion.cancel_question();
  - platform: template
    name: ${t_clear_post}
    icon: mdi:email-remove-outline
    on_press:
      - lambda: yellow::companion.clear_post();

select:
  - platform: template
    id: view_mode
    name: ${t_view}
    icon: mdi:emoticon-happy-outline
    options: [Auto, Yellow, "${t_opt_clock}"]
    initial_option: Auto
    optimistic: true
    restore_value: false # always Auto after a reboot (crash protection while testing)
    entity_category: config
    on_value:
      - script.execute: view
  - platform: template
    id: decor_mode
    name: ${t_decor}
    icon: mdi:pine-tree
    options: [Auto, "${t_opt_off}", Halloween, "${t_opt_christmas}"]
    initial_option: Auto
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: 'yellow::companion.decor(i);'
  - platform: template
    id: character
    name: ${t_character}
    icon: mdi:paw
    options: [Okti, "${t_opt_robot}", "${t_opt_fox}"]
    initial_option: Okti
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: 'yellow::companion.kind((yellow::Kind) i);'

script:
  - id: draw_rows # info rows of the clock (alarm, appointment, notice) from the profile's data sources
    then:
      - lambda: |-
          auto row = [](lv_obj_t *l, const std::string &x, const char *sym) {
            if (x.empty() || x == "-" || x == "unknown" || x == "unavailable") {
              lv_obj_add_flag(l, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_label_set_text(l, (std::string(sym) + "  " + x).c_str());
              lv_obj_clear_flag(l, LV_OBJ_FLAG_HIDDEN);
            }
          };
          row(id(z_alarm), id(ha_alarm).state, "\U000F0020");
          row(id(z_appointment), id(ha_appointment).state, "\U000F00ED");
          row(id(z_notice), id(ha_notice).state, "\U000F0A79");
  - id: draw_clock
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          bool night_now = t.hour >= 21 || t.hour < 7;
          uint32_t off = night_now ? ${color_night_2} : ${color_day_2}; // colon blinks every second
          if (t.second % 2) lv_label_set_text(id(lbl_clock), str_sprintf("%02d#%06X :#%02d", t.hour, (unsigned) off, t.minute).c_str());
          else lv_label_set_text(id(lbl_clock), str_sprintf("%02d:%02d", t.hour, t.minute).c_str());
          lv_label_set_text(id(lbl_date), str_sprintf(yellow::txt::DATE_FMT, yellow::txt::DAYS[t.day_of_week - 1], t.day_of_month, yellow::txt::MONTHS[t.month - 1]).c_str());
          yellow::companion.clock(t.hour, t.minute);
          yellow::companion.season(t.month, t.day_of_month);
          int night = (t.hour >= 21 || t.hour < 7) ? 1 : 0;
          if (night != id(night_colors)) {
            id(night_colors) = night;
            lv_color_t c1 = lv_color_hex(night ? ${color_night} : ${color_day});
            lv_color_t c2 = lv_color_hex(night ? ${color_night_2} : ${color_day_2});
            lv_obj_set_style_text_color(id(lbl_clock), c1, 0);
            lv_obj_set_style_text_color(id(rows), c1, 0);
            lv_obj_set_style_text_color(id(lbl_date), c2, 0);
            lv_obj_set_style_text_color(id(z_climate), c2, 0);
          }
  - id: draw_weather
    then:
      - lambda: |-
          const std::string &x = id(ha_weather).state, &c = id(ha_weather_condition).state;
          yellow::companion.weather(c);
          if (x.empty() || x == "-" || x == "unknown" || x == "unavailable") {
            lv_obj_add_flag(id(z_weather), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          const char *sym = "\U000F0590";
          if (c == "sunny") sym = "\U000F0599";
          else if (c == "clear-night") sym = "\U000F0594";
          else if (c == "partlycloudy") sym = "\U000F0595";
          else if (c == "rainy") sym = "\U000F0597";
          else if (c == "pouring") sym = "\U000F0596";
          else if (c == "snowy") sym = "\U000F0598";
          else if (c == "snowy-rainy") sym = "\U000F067F";
          else if (c == "lightning") sym = "\U000F0593";
          else if (c == "lightning-rainy") sym = "\U000F067E";
          else if (c == "fog") sym = "\U000F0591";
          else if (c == "hail") sym = "\U000F0592";
          else if (c == "windy" || c == "windy-variant") sym = "\U000F059D";
          lv_label_set_text(id(z_weather), (std::string(sym) + "  " + x).c_str());
          lv_obj_clear_flag(id(z_weather), LV_OBJ_FLAG_HIDDEN);
  - id: draw_climate
    then:
      - lambda: |-
          float t = id(climate_temp).state, h = id(climate_humidity).state;
          if (std::isnan(t)) return;
          std::string s = str_sprintf("\U000F0F54 %.1f°", t);
          if (!std::isnan(h)) s += str_sprintf(" %.0f%%", h);
          float a = id(outdoor_temp).state; // measured; the forecast is in the weather row
          if (!std::isnan(a)) s += str_sprintf("  \U000F18D7 %.0f°", a);
          if (yellow::txt::DECIMAL_COMMA) for (auto &ch : s) if (ch == '.') ch = ',';
          lv_label_set_text(id(z_climate), s.c_str());
  - id: show_day_info # hold Yellow (or command hold): the day's info, progress from HA and the records as signs
    then:
      - lambda: |-
          auto good = [](const std::string &x) { return !x.empty() && x != "-" && x != "unknown" && x != "unavailable"; };
          std::string t;
          if (good(id(ha_alarm).state)) t += id(ha_alarm).state + "\n";
          if (good(id(ha_appointment).state)) t += id(ha_appointment).state + "\n";
          if (good(id(ha_weather).state)) t += id(ha_weather).state + "\n";
          if (good(id(ha_notice).state)) t += id(ha_notice).state + "\n";
          float k = id(climate_temp).state;
          if (!std::isnan(k)) {
            std::string z = str_sprintf(yellow::txt::HERE_TEMP, k);
            if (yellow::txt::DECIMAL_COMMA) for (auto &ch : z) if (ch == '.') ch = ',';
            t += z + "\n";
          }
          if (good(id(ha_progress).state)) t += id(ha_progress).state + "\n";
          // records last: the least important, dropped first by the 8-sign cap
          int r = id(best_reaction_ms), m = id(best_simon);
          if (r > 0 && m > 0) t += str_sprintf(yellow::txt::RECORDS_FMT, r, m);
          else if (r > 0) t += str_sprintf(yellow::txt::RECORD_REACTION_FMT, r);
          else if (m > 0) t += str_sprintf(yellow::txt::RECORD_SIMON_FMT, m);
          yellow::companion.message(t.empty() ? std::string(yellow::txt::NOTHING_TODAY) : t, false, 3);
  - id: store_record # game result → device record (reaction: fastest ms, simon: most rounds); -2 = aborted
    parameters:
      game: string
      value: int
    then:
      - lambda: |-
          if (game == "reaction" && value > 0 && (id(best_reaction_ms) == 0 || value < id(best_reaction_ms))) id(best_reaction_ms) = value;
          else if (game == "simon" && value > id(best_simon)) id(best_simon) = value;
  - id: log_activity
    mode: queued
    parameters:
      what: string
    then:
      - lambda: |-
          auto &p = id(activity_log);
          auto t = id(ha_time).now();
          p.push_back((t.is_valid() ? t.strftime("%H:%M ") : std::string("--:-- ")) + what);
          if (p.size() > 30) p.erase(p.begin());
  - id: open_wifi # Wi-Fi dialog (tap on the red network icon): networks from the last scan, strongest first
    then:
      - lambda: |-
          std::vector<std::pair<int, std::string>> networks;
          for (auto &r : wifi::global_wifi_component->get_scan_result()) {
            std::string s(r.get_ssid().c_str(), r.get_ssid().size());
            bool fresh = !s.empty();
            for (auto &n : networks) if (n.second == s) fresh = false;
            if (fresh) networks.push_back({r.get_rssi(), s});
          }
          std::sort(networks.begin(), networks.end(), [](const auto &a, const auto &b) { return a.first > b.first; });
          std::string opt;
          for (auto &n : networks) opt += (opt.empty() ? "" : "\n") + n.second;
          lv_dropdown_set_options(id(wifi_list)->obj, opt.empty() ? yellow::txt::NO_WIFI_FOUND : opt.c_str());
          lv_textarea_set_text(id(wifi_password_box), "");
      - lvgl.page.show: wifi_page
      - script.execute: wake_display
  - id: connect_wifi # OK on the keyboard: save network + password, ESPHome reconnects
    then:
      - lambda: |-
          char ssid[65];
          lv_dropdown_get_selected_str(id(wifi_list)->obj, ssid, sizeof(ssid));
          if (wifi::global_wifi_component->get_scan_result().empty()) return;
          wifi::global_wifi_component->save_wifi_sta(std::string(ssid), std::string(lv_textarea_get_text(id(wifi_password_box))));
          yellow::companion.message(str_sprintf(yellow::txt::TRYING_WIFI_FMT, ssid), false, 3);
      - lvgl.page.show: main_page
  - id: wake_display
    then:
      - lambda: id(awake_until) = millis() + 30000;
      - script.execute: brightness
  - id: view # Yellow or clock, every 3 s and on changes
    then:
      - lambda: |-
          if (!yellow::companion.ready()) return; // selects fire before LVGL is up (boot loop 2026-10-24)
          float v = id(ldr).state;
          bool dark = id(dark_test) || (!std::isnan(v) && v >= ${ldr_dark});
          const size_t m = id(view_mode).active_index().value_or(0);
          // Auto and Yellow: Yellow as soon as there is light; never in the dark (then only the dim clock when tapped)
          bool yellow = (!dark || id(wake_mode).state) && m != 2;
          if (id(clock_until) != 0) {
            if ((int32_t) (millis() - id(clock_until)) < 0) yellow = false;
            else id(clock_until) = 0;
          }
          if (yellow) lv_obj_add_flag(id(clock_view), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(clock_view), LV_OBJ_FLAG_HIDDEN);
          yellow::companion.visible(yellow);
          yellow::companion.night_sleeper(id(clock_view), dark && !yellow && !yellow::companion.is_away());
          static bool was_dark = false;  // light goes on → Yellow gets a fright
          if (was_dark && !dark && yellow) yellow::companion.light_scare();
          if (!std::isnan(v)) was_dark = dark;
  - id: show_panel # show the panel briefly for help/confirmation, hides itself
    mode: restart
    parameters:
      seconds: int
    then:
      - lvgl.widget.hide: rows
      - lvgl.widget.show: assist
      - delay: !lambda return seconds * 1000;
      - lvgl.widget.hide: assist
      - lvgl.widget.show: rows
  - id: brightness
    then:
      - lambda: |-
          if (!id(auto_brightness).state) return;
          float v = id(ldr).state;
          bool dark = !std::isnan(v) && v >= ${ldr_dark};
          bool awake = millis() < id(awake_until);
          float target; // off in the dark; when tapped only the clock, very dim
          if (dark) target = (awake || !id(off_at_night).state) ? 0.05f : 0.0f;
          else target = awake ? 0.8f : 0.7f;
          float actual = id(backlight).current_values.is_on() ? id(backlight).current_values.get_brightness() : 0.0f;
          if (fabsf(actual - target) < 0.04f) return;
          if (target <= 0.0f) {
            id(backlight).turn_off().perform();
          } else {
            auto call = id(backlight).turn_on();
            call.set_brightness(target);
            call.perform();
          }

http_request:
  follow_redirects: false # a redirect (e.g. 301 to https) is enough as a sign of life
  timeout: 5s

interval:
  - interval: 5s # network status: red without Wi-Fi, orange without MQTT (the text says whether the internet is missing)
    then:
      - lambda: |-
          if (!yellow::companion.ready()) return;
          static std::string last;  // last connected network (not sent, only the name as a sensor)
          static uint32_t mqtt_lost_since = 0;
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          const bool mqtt_ok = mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected();
          if (wifi_ok && !id(wifi_name).state.empty() && id(wifi_name).state != last) {
            if (!last.empty()) id(log_activity).execute("wifi " + id(wifi_name).state);
            last = id(wifi_name).state;
          }
          if (mqtt_ok || !wifi_ok) mqtt_lost_since = 0;
          else if (mqtt_lost_since == 0) mqtt_lost_since = millis();
          // orange only after 30 s so a short reconnect does not blink
          const bool mqtt_lost = mqtt_lost_since != 0 && millis() - mqtt_lost_since > 30000;
          int level = !wifi_ok ? 1 : !mqtt_lost ? 0 : id(internet_ok) ? 2 : 3;
          yellow::companion.network(id(network_test) ? id(network_test) : level, last);
  - interval: 10s # the Wi-Fi dialog closes 5 min after the last touch (owner's wish)
    then:
      - if:
          condition:
            lambda: return lv_scr_act() == id(wifi_page)->obj && (int32_t) (millis() - id(awake_until)) > 270000;  // awake_until = touch + 30 s
          then:
            - lvgl.page.show: main_page
  - interval: 60s # internet check only while MQTT is missing: any HTTP answer from the server (even 301) counts
    then:
      - if:
          condition:
            lambda: |-
              return wifi::global_wifi_component->is_connected() &&
                     !(mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected());
          then:
            - http_request.get:
                url: ${internet_check_url}
                capture_response: false
                on_response:
                  then:
                    - lambda: id(internet_ok) = true;
                on_error:
                  then:
                    - lambda: id(internet_ok) = false;
  - interval: 3s
    then:
      - script.execute: brightness
      - script.execute: view
  - interval: 50ms
    then:
      - lambda: yellow::companion.tick();

