lvgl:
  displays: [tft]
  rotation: ${drehung}
  touchscreens:
    - touchscreen_id: touch
      long_press_time: 1200ms
  buffer_size: 25%
  default_font: font_text
  pages:
    - id: seite
      bg_color: 0x000000
      scrollable: false
      widgets:
        - label: # Startbildschirm bis die Figur da ist (kein Uhr-Bild vorweg); Text zufällig beim Start
            id: start_text
            align: CENTER
            text: "Moment bitte …"
            text_color: 0x8A93A6
        - obj: # Fläche für Antippen / langen Druck, alles andere liegt darin (Yellow baut sich in yellow.h hier hinein)
            id: flaeche
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            on_press:
              - lambda: |-
                  id(war_an) = id(backlight).current_values.is_on();
                  lv_point_t p;
                  lv_indev_get_point(lv_indev_get_act(), &p);
                  id(tipp_rechts_oben) = p.x > 240 && p.y < 44;
                  id(tipp_hilfe) = p.x > 284 && p.y > 200;
                  id(tipp_netz) = p.x > 262 && p.x <= 284 && p.y > 200;
                  id(tipp_spiele) = p.x < 30 && p.y > 200;
                  id(tipp_y) = p.y;
              - script.execute: aufwecken
            on_long_press: # Yellow halten → Infos der Uhr als Schilder
              - if:
                  condition:
                    lambda: return yellow::figur.ist_sichtbar() && !yellow::figur.streichelt() && !yellow::figur.hilfe_offen();
                  then:
                    - lambda: |-
                        auto gut = [](const std::string &x) { return !x.empty() && x != "-" && x != "unknown" && x != "unavailable"; };
                        std::string t;
                        if (gut(id(ha_wecker).state)) t += id(ha_wecker).state + "\n";
                        if (gut(id(ha_termin).state)) t += id(ha_termin).state + "\n";
                        if (gut(id(ha_wetter).state)) t += id(ha_wetter).state + "\n";
                        if (gut(id(ha_hinweis).state)) t += id(ha_hinweis).state + "\n";
                        float k = id(klima_temp).state;
                        if (!std::isnan(k)) {
                          std::string z = str_sprintf("Hier %.1f°", k);
                          for (auto &ch : z) if (ch == '.') ch = ',';
                          t += z;
                        }
                        yellow::figur.nachricht(t.empty() ? std::string("Nix los heute.") : t, false, 3);
            on_short_click:
              - if:
                  condition:
                    lambda: return id(war_an) && !yellow::figur.streichelt() && yellow::figur.ist_sichtbar();
                  then:
                    - lambda: |-
                        // „?“ öffnet die Hilfe, jeder Tipp schließt sie; kleine Uhr → 15 s Uhr (Ottes); sonst anstupsen
                        if (yellow::figur.spiele_offen()) {
                          yellow::figur.spiele_tipp(id(tipp_y));
                        } else if (id(tipp_netz) && yellow::figur.netz_stufe() == 1) {
                          id(wlan_oeffnen).execute();
                        } else if (yellow::figur.hilfe_offen() || id(tipp_hilfe)) {
                          yellow::figur.hilfe(!yellow::figur.hilfe_offen());
                        } else if (id(tipp_spiele)) {
                          yellow::figur.spiele_menue(true);
                        } else if (id(tipp_rechts_oben)) {
                          id(uhr_bis) = millis() + 15000;
                          id(ansicht).execute();
                        } else {
                          yellow::figur.anstupsen();
                        }
            widgets:
              - obj: # Uhr-Ansicht (Querformat 320×240)
                  id: uhr_ansicht
                  width: 100%
                  height: 100%
                  hidden: true # erst die Ansicht-Logik zeigt die Uhr (Start: Yellow begrüßt)
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  widgets:
                    - label:
                        id: lbl_uhr
                        align: TOP_MID
                        y: 2
                        text: "--:--"
                        recolor: true
                        text_font: font_uhr
                        text_color: ${farbe_tag}
                    - label:
                        id: lbl_datum
                        x: 10
                        y: 90
                        width: 104
                        long_mode: DOT
                        text: ""
                        text_color: ${farbe_tag_2}
                    - label:
                        id: z_klima
                        align: TOP_RIGHT
                        x: -10
                        y: 90
                        width: 200
                        long_mode: DOT
                        text_align: RIGHT
                        text: ""
                        text_color: ${farbe_tag_2}
                    - obj: # Infozeilen
                        id: zeilen
                        x: 14
                        y: 124
                        width: 292
                        height: 112
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        scrollable: false
                        text_color: ${farbe_tag}
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          pad_row: 6
                        widgets:
                          - label: { id: z_wecker, width: 100%, long_mode: DOT, text: "", hidden: true }
                          - label: { id: z_termin, width: 100%, long_mode: DOT, text: "", hidden: true }
                          - label: { id: z_wetter, width: 100%, long_mode: DOT, text: "", hidden: true }
                          - label: { id: z_hinweis, width: 100%, long_mode: DOT, text: "", hidden: true, text_color: 0xFF6B3D }
              - obj: # Assist: was gesagt wurde und was zurückkommt
                  id: assist
                  x: 8
                  y: 118
                  width: 304
                  height: 116
                  hidden: true
                  clickable: false
                  scrollable: false
                  bg_color: 0x0E1622
                  border_width: 0
                  radius: 12
                  pad_all: 10
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 6
                  widgets:
                    - label:
                        id: lbl_ein
                        width: 100%
                        long_mode: DOT
                        max_height: 24
                        text: ""
                        text_color: 0xE8E8E8
                    - label:
                        id: lbl_aus
                        width: 100%
                        long_mode: DOT
                        max_height: 66
                        text: ""
                        text_color: 0x7FB8FF
              - obj: # Yellows Pappschild, yellow.h schiebt es von oben herein
                  id: schild
                  x: 60
                  y: -100
                  width: 200
                  height: 80
                  hidden: true
                  clickable: false
                  scrollable: false
                  bg_color: 0xF4E4C1
                  border_width: 3
                  border_color: 0x8B6B3E
                  radius: 6
                  pad_all: 4
                  widgets:
                    - label:
                        id: schild_text
                        align: CENTER
                        width: 100%
                        long_mode: WRAP
                        text_align: CENTER
                        text_font: font_schild
                        text_color: 0x3A2A18
                        text: ""
              - arc: # nur damit LVGL Bögen mitbaut (Augen und Mund in yellow.h)
                  id: bogen_vorlage
                  hidden: true
                  clickable: false
              - label: # trägt nur die Deko-Schrift, damit yellow.h sie bekommt
                  id: deko_vorlage
                  hidden: true
                  text: ""
                  text_font: font_deko
              - label: # trägt nur die Statuszeilen-Symbole
                  id: status_vorlage
                  hidden: true
                  text: ""
                  text_font: font_status
              - line: # nur damit LVGL Linien mitbaut (Oktis Arme in yellow.h)
                  id: linie_vorlage
                  hidden: true
                  points:
                    - 0, 0
                    - 1, 1
    - id: wlan_seite # WLAN-Dialog: Netz wählen, Passwort tippen, OK
      bg_color: 0x000000
      scrollable: false
      widgets:
        - dropdown:
            id: wlan_liste
            x: 4
            y: 4
            width: 220
            options: ["-"]
            on_press:
              - script.execute: aufwecken
            indicator:
              text_font: montserrat_14
        - button:
            x: 230
            y: 4
            width: 86
            height: 40
            on_click:
              - lvgl.page.show: seite
            widgets:
              - label:
                  align: CENTER
                  text: "Zurück"
        - textarea:
            id: wlan_passwort
            x: 4
            y: 50
            width: 312
            one_line: true
            placeholder_text: "Passwort, dann OK"
            on_ready:
              - script.execute: wlan_verbinden
        - keyboard:
            id: wlan_tastatur
            textarea: wlan_passwort
            align: BOTTOM_MID
            height: 140
            on_press:
              - script.execute: aufwecken
            items:
              text_font: montserrat_14

text_sensor:
  - platform: wifi_info
    ssid:
      id: wlan_name
      name: WLAN
      icon: mdi:wifi
  - platform: template
    name: Yellow heute # Tageszahlen tipps|streicheln|spiele|faust (für die Tagesbilanz in HA)
    icon: mdi:counter
    update_interval: 60s
    lambda: return yellow::figur.zahlen_text();
  # Infozeilen: "-" oder leer blendet die Zeile aus

sensor:
  - platform: template
    name: Yellow Nachrichten wartend
    icon: mdi:email-alert-outline
    accuracy_decimals: 0
    update_interval: 2s
    lambda: return yellow::figur.wartend();
    filters:
      - delta: 0.5
  - platform: debug # Speicher beobachten, wegen der Hänger
    free:
      name: Freier Speicher
      entity_category: diagnostic
    block:
      name: Größter freier Block
      state_topic: yellow/${geraet}/sensor/groesster_freier_block/state # Umlaut ergäbe gr____ter_…
      entity_category: diagnostic

binary_sensor:
  - platform: template
    id: yellow_wach
    name: Yellow sichtbar
    icon: mdi:emoticon-happy-outline
    lambda: return yellow::figur.ist_sichtbar();
