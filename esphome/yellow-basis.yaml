# Einstellungen (in der Gerätedatei überschreibbar): leer = frei bzw. später am Gerät einstellbar
substitutions:
  person: "" # Anzeigename der Besitzerin/des Besitzers, z. B. für die Begrüßung („Hallo Anna!“)
  figur_name: Yellow # wie sich die Figur nennt
  figur_fest: "" # Okti, Fuchs oder Roboter fest einbrennen (leer = per Auswahl „Figur“)
  yellow_pfad: cheap-yellow-companion/esphome # Ordner dieser Dateien, relativ zur Gerätedatei
  internet_check_url: http://connectivitycheck.gstatic.com/generate_204 # jede HTTP-Antwort zählt als „Internet da“

# Yellow – Basis (jedes Profil): Figur (yellow.h), Display, Touch, Schild, Uhr-Ansicht, Regler, Schalter, Spiele.
# Erwartet vom Profil diese Datenquellen (IDs): ha_time, ha_wetter, ha_wetter_lage, ha_termin, ha_wecker, ha_hinweis,
# klima_temp, klima_feuchte, aussen_temp, tuerklingel, ha_anlass. Profil „Zuhause“: yellow-zuhause.yaml (HA).

esphome:
  includes: # Kern yellow.h, Themen in eigenen Headern (yellow.h bindet sie ein)
    - ${yellow_pfad}/yellow_daten.h
    - ${yellow_pfad}/yellow.h
    - ${yellow_pfad}/yellow_spiele.h
    - ${yellow_pfad}/yellow_spezial.h
    - ${yellow_pfad}/yellow_deko.h
    - ${yellow_pfad}/yellow_koerper.h
    - ${yellow_pfad}/yellow_post.h
  on_boot:
    - priority: 200 # LVGL steht schon: zufälliger Satz auf dem Startbildschirm
      then:
        - lambda: |-
            static const char *const satz[] = {"Moment bitte …", "Bitte warten …", "Lade …", "Wache auf …",
                                               "Suche meine Schilder …", "Strecke mich …", "Gleich da!", "Kaffee?"};
            lv_label_set_text(id(start_text), satz[esphome::random_uint32() % 8]);
    - priority: -100
      then:
      - lambda: |-
          if (!std::string("${figur_fest}").empty()) id(figur_art).publish_state("${figur_fest}");  // beim Build festgelegt
          yellow::figur.art(id(figur_art).current_option() == "Roboter" ? yellow::ROBOTER : id(figur_art).current_option() == "Fuchs" ? yellow::FUCHS : yellow::OKTI);
          yellow::figur.stimmung((int) id(yellow_stimmung).state);
          yellow::figur.anspannung((int) id(yellow_anspannung).state);
          yellow::figur.energie((int) id(yellow_energie).state);
          yellow::figur.deko_schrift(lv_obj_get_style_text_font(id(deko_vorlage), LV_PART_MAIN));
          yellow::figur.status_schrift(lv_obj_get_style_text_font(id(status_vorlage), LV_PART_MAIN));
          yellow::figur.ziffer_schrift(lv_obj_get_style_text_font(id(lbl_uhr), LV_PART_MAIN));
          yellow::figur.aufbauen(id(flaeche), id(schild), id(schild_text));
          lv_obj_add_flag(id(start_text), LV_OBJ_FLAG_HIDDEN);
          wifi::global_wifi_component->set_keep_scan_results(true);  // Netzliste für den WLAN-Dialog
          yellow::figur.deko(id(deko_modus).active_index().value_or(0));
          yellow::figur.fern_sprueche(id(sprueche_gesichert).data());
          // Ereignisse als JSON an yellow/<gerät>/ereignis (gleicher Weg zuhause und unterwegs)
          static auto ereignis = [](const char *typ, const std::string &text, const std::string &spiel, int wert) {
            id(protokoll_merken).execute(spiel.empty() ? std::string(typ) : std::string(typ) + " " + spiel + " " + to_string(wert));
            if (mqtt::global_mqtt_client == nullptr || !mqtt::global_mqtt_client->is_connected()) return;
            mqtt::global_mqtt_client->publish_json("yellow/${geraet}/ereignis", [=](JsonObject root) {
              root["typ"] = typ;
              if (!text.empty()) root["text"] = text;
              if (!spiel.empty()) { root["spiel"] = spiel; root["wert"] = wert; }
            });
          };
          yellow::figur.timer_aus = []() {
            ereignis("timer_aus", "", "", 0);
          };
          yellow::figur.aufgewacht = []() {
            id(yellow_schlaf).publish_state(false);
            id(protokoll_merken).execute(std::string("aufgewacht"));
          };
          yellow::figur.gestreichelt = [](const std::string &schild) {
            ereignis("gestreichelt", schild, "", 0);
          };
          yellow::figur.spiel_ende = [](const std::string &spiel, int wert) {
            ereignis("spiel", "", spiel, wert);
          };
          yellow::figur.antwort = [](const std::string &a) {
            ereignis("antwort", a.empty() ? std::string("(keine Antwort)") : a, "", 0);
          };
          yellow::figur.gelesen = [](const std::string &t) {
            ereignis("gelesen", t, "", 0);
          };
          yellow::figur.led = [](uint32_t rgb, float hell) {
            if (hell <= 0) {
              auto call = id(status_led).turn_off();
              call.set_transition_length(600);
              call.perform();
              return;
            }
            auto call = id(status_led).turn_on();
            call.set_rgb(((rgb >> 16) & 0xFF) / 255.0f, ((rgb >> 8) & 0xFF) / 255.0f, (rgb & 0xFF) / 255.0f);
            call.set_brightness(hell);
            call.set_transition_length(150);
            call.perform();
          };
      - script.execute: ansicht
      - delay: 1500ms # Begrüßung nach dem Start (nicht im Dunkeln, dann ist Yellow unsichtbar)
      - lambda: |-
          yellow::figur.geste("winken");
          const std::string person = "${person}", figur_name = "${figur_name}";
          if (person.empty()) yellow::figur.zeige_schild("Hallo!", 5);
          else yellow::figur.nachricht("Hallo " + person + "!\nIch bin " + figur_name + ".", false, 3);

globals:
  - id: netz_test # Befehl netz_test: Netzstufe nur anzeigen (1 WLAN, 2 MQTT, 3 Internet; 0 = echt)
    type: int
    initial_value: "0"
  - id: internet_ok # Ergebnis des letzten Internet-Checks (nur geprüft, solange MQTT getrennt ist)
    type: bool
    initial_value: "true"
  - id: wach_bis
    type: uint32_t
    initial_value: "0"
  - id: nachtfarben
    type: int
    initial_value: "-1"
  - id: war_an # Display war beim Antippen schon an (sonst nur aufwecken)
    type: bool
    initial_value: "true"
  - id: tipp_rechts_oben # Druck auf die kleine Uhr bei Yellow
    type: bool
    initial_value: "false"
  - id: tipp_hilfe # Druck auf das „?“ unten rechts
    type: bool
    initial_value: "false"
  - id: protokoll # Aktivitätsprotokoll „HH:MM was“ bis zur nächsten Telemetrie (höchstens 30 Einträge)
    type: std::vector<std::string>
  - id: sprueche_gesichert # Spruchliste aus der Ferne, lokal gesichert für Neustarts ohne Netz
    type: std::array<char, 600>
    restore_value: true
  - id: tipp_spiele # Druck auf das Spiele-Symbol unten links
    type: bool
    initial_value: "false"
  - id: tipp_y # y des letzten Drucks (Spiele-Auswahl)
    type: int
    initial_value: "0"
  - id: tipp_netz # Druck auf das Netzsymbol links neben dem „?“
    type: bool
    initial_value: "false"
  - id: uhr_bis # bis dahin Uhr statt Yellow (nach Antippen der kleinen Uhr)
    type: uint32_t
    initial_value: "0"

switch:
  - platform: template
    id: nachts_aus
    name: Nachts aus
    icon: mdi:power-sleep
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: yellow_schlaf # Yellow schlafen legen (auch per Sprache über Nabu); Antippen weckt ihn
    name: Yellow schläft
    state_topic: yellow/${geraet}/switch/yellow_schlaeft/state # Umlaut ergäbe yellow_schl__ft
    command_topic: yellow/${geraet}/switch/yellow_schlaeft/command
    icon: mdi:sleep
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: yellow::figur.schlafen(true);
    turn_off_action:
      - lambda: yellow::figur.schlafen(false);
  - platform: template
    id: weckmodus # HA schaltet ihn für den Sonnenaufgang: Yellow darf dann auch im Dunkeln sichtbar sein
    name: Weckmodus
    icon: mdi:weather-sunset-up
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config
    turn_on_action: # Zustand wird erst nach der Aktion gesetzt, daher kurz warten
      - delay: 50ms
      - script.execute: ansicht
    turn_off_action:
      - delay: 50ms
      - script.execute: ansicht
  - platform: template
    id: auto_helligkeit
    name: Auto-Helligkeit
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

number:
  - platform: template # Yellows Stimmung: 0 gelb und froh … 100 rot und grummelig (Mundwinkel runter, Brauen)
    id: yellow_stimmung
    name: Yellow Stimmung
    icon: mdi:emoticon-angry-outline
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 0
    on_value:
      - lambda: yellow::figur.stimmung((int) x);
  - platform: template # 0 entspannt … 100 super nervös (Tempo, Blinzeln, Schweiß, Zusammenzucken); HA füttert automatisch
    id: yellow_anspannung
    name: Yellow Anspannung
    icon: mdi:heart-pulse
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 20
    on_value:
      - lambda: yellow::figur.anspannung((int) x);
  - platform: template # 0 todmüde … 100 hellwach (Atem, Gähnen, Langeweile); HA füttert automatisch nach Tageszeit
    id: yellow_energie
    name: Yellow Energie
    icon: mdi:battery-heart-variant
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 70
    on_value:
      - lambda: yellow::figur.energie((int) x);

button:
  - platform: template
    name: Yellow Post abspielen
    icon: mdi:email-open-outline
    on_press:
      - lambda: yellow::figur.post_abspielen();
  - platform: template
    name: Yellow Reaktionstest
    icon: mdi:timer-play-outline
    on_press:
      - lambda: yellow::figur.spiel("reaktion");
  - platform: template
    name: Yellow Tic-Tac-Toe
    icon: mdi:grid
    on_press:
      - lambda: yellow::figur.spiel("ttt");
  - platform: template
    name: Yellow Simon Says
    icon: mdi:palette-swatch-outline
    on_press:
      - lambda: yellow::figur.spiel("simon");
  - platform: template
    name: Yellow Frage abbrechen
    icon: mdi:comment-remove-outline
    on_press:
      - lambda: yellow::figur.frage_abbrechen();
  - platform: template
    name: Yellow Post leeren
    icon: mdi:email-remove-outline
    on_press:
      - lambda: yellow::figur.post_leeren();

select:
  - platform: template
    id: ansicht_modus
    name: Ansicht
    icon: mdi:emoticon-happy-outline
    options: [Auto, Yellow, Uhr]
    initial_option: Auto
    optimistic: true
    restore_value: false # nach einem Neustart immer Auto (Absturzschutz beim Testen)
    entity_category: config
    on_value:
      - script.execute: ansicht
  - platform: template
    id: deko_modus
    name: Deko
    icon: mdi:pine-tree
    options: [Auto, Aus, Halloween, Weihnachten]
    initial_option: Auto
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: 'yellow::figur.deko(i);'
  - platform: template
    id: figur_art
    name: Figur
    icon: mdi:paw
    options: [Okti, Roboter, Fuchs]
    initial_option: Okti
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: 'yellow::figur.art(x == "Roboter" ? yellow::ROBOTER : x == "Fuchs" ? yellow::FUCHS : yellow::OKTI);'

script:
  - id: zeilen_zeichnen # Infozeilen der Uhr (Wecker, Termin, Hinweis) aus den Datenquellen des Profils
    then:
      - lambda: |-
          auto zeile = [](lv_obj_t *l, const std::string &x, const char *sym) {
            if (x.empty() || x == "-" || x == "unknown" || x == "unavailable") {
              lv_obj_add_flag(l, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_label_set_text(l, (std::string(sym) + "  " + x).c_str());
              lv_obj_clear_flag(l, LV_OBJ_FLAG_HIDDEN);
            }
          };
          zeile(id(z_wecker), id(ha_wecker).state, "\U000F0020");
          zeile(id(z_termin), id(ha_termin).state, "\U000F00ED");
          zeile(id(z_hinweis), id(ha_hinweis).state, "\U000F0A79");
  - id: uhr_zeichnen
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) return;
          static const char *tage[] = {"So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
          static const char *monate[] = {"Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"};
          bool nacht_jetzt = t.hour >= 21 || t.hour < 7;
          uint32_t aus = nacht_jetzt ? ${farbe_nacht_2} : ${farbe_tag_2}; // Doppelpunkt blinkt im Sekundentakt
          if (t.second % 2) lv_label_set_text(id(lbl_uhr), str_sprintf("%02d#%06X :#%02d", t.hour, (unsigned) aus, t.minute).c_str());
          else lv_label_set_text(id(lbl_uhr), str_sprintf("%02d:%02d", t.hour, t.minute).c_str());
          lv_label_set_text(id(lbl_datum), str_sprintf("%s %d. %s", tage[t.day_of_week - 1], t.day_of_month, monate[t.month - 1]).c_str());
          yellow::figur.uhr(t.hour, t.minute);
          yellow::figur.saison(t.month, t.day_of_month);
          int nacht = (t.hour >= 21 || t.hour < 7) ? 1 : 0;
          if (nacht != id(nachtfarben)) {
            id(nachtfarben) = nacht;
            lv_color_t c1 = lv_color_hex(nacht ? ${farbe_nacht} : ${farbe_tag});
            lv_color_t c2 = lv_color_hex(nacht ? ${farbe_nacht_2} : ${farbe_tag_2});
            lv_obj_set_style_text_color(id(lbl_uhr), c1, 0);
            lv_obj_set_style_text_color(id(zeilen), c1, 0);
            lv_obj_set_style_text_color(id(lbl_datum), c2, 0);
            lv_obj_set_style_text_color(id(z_klima), c2, 0);
          }
  - id: wetter_zeichnen
    then:
      - lambda: |-
          const std::string &x = id(ha_wetter).state, &c = id(ha_wetter_lage).state;
          yellow::figur.wetter(c);
          if (x.empty() || x == "-" || x == "unknown" || x == "unavailable") {
            lv_obj_add_flag(id(z_wetter), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          const char *sym = "\U000F0590";
          if (c == "sunny") sym = "\U000F0599";
          else if (c == "clear-night") sym = "\U000F0594";
          else if (c == "partlycloudy") sym = "\U000F0595";
          else if (c == "rainy") sym = "\U000F0597";
          else if (c == "pouring") sym = "\U000F0596";
          else if (c == "snowy") sym = "\U000F0598";
          else if (c == "snowy-rainy") sym = "\U000F067F";
          else if (c == "lightning") sym = "\U000F0593";
          else if (c == "lightning-rainy") sym = "\U000F067E";
          else if (c == "fog") sym = "\U000F0591";
          else if (c == "hail") sym = "\U000F0592";
          else if (c == "windy" || c == "windy-variant") sym = "\U000F059D";
          lv_label_set_text(id(z_wetter), (std::string(sym) + "  " + x).c_str());
          lv_obj_clear_flag(id(z_wetter), LV_OBJ_FLAG_HIDDEN);
  - id: klima_zeichnen
    then:
      - lambda: |-
          float t = id(klima_temp).state, h = id(klima_feuchte).state;
          if (std::isnan(t)) return;
          std::string s = str_sprintf("\U000F0F54 %.1f°", t);
          if (!std::isnan(h)) s += str_sprintf(" %.0f%%", h);
          float a = id(aussen_temp).state; // gemessen, die Vorhersage steht in der Wetterzeile
          if (!std::isnan(a)) s += str_sprintf("  \U000F18D7 %.0f°", a);
          for (auto &ch : s) if (ch == '.') ch = ',';
          lv_label_set_text(id(z_klima), s.c_str());
  - id: protokoll_merken
    mode: queued
    parameters:
      was: string
    then:
      - lambda: |-
          auto &p = id(protokoll);
          auto t = id(ha_time).now();
          p.push_back((t.is_valid() ? t.strftime("%H:%M ") : std::string("--:-- ")) + was);
          if (p.size() > 30) p.erase(p.begin());
  - id: wlan_oeffnen # WLAN-Dialog (Tipp aufs rote Netzsymbol): Netze aus dem letzten Scan, stärkstes zuerst
    then:
      - lambda: |-
          std::vector<std::pair<int, std::string>> netze;
          for (auto &r : wifi::global_wifi_component->get_scan_result()) {
            std::string s(r.get_ssid().c_str(), r.get_ssid().size());
            bool neu = !s.empty();
            for (auto &n : netze) if (n.second == s) neu = false;
            if (neu) netze.push_back({r.get_rssi(), s});
          }
          std::sort(netze.begin(), netze.end(), [](const auto &a, const auto &b) { return a.first > b.first; });
          std::string opt;
          for (auto &n : netze) opt += (opt.empty() ? "" : "\n") + n.second;
          lv_dropdown_set_options(id(wlan_liste)->obj, opt.empty() ? "kein WLAN gefunden" : opt.c_str());
          lv_textarea_set_text(id(wlan_passwort), "");
      - lvgl.page.show: wlan_seite
      - script.execute: aufwecken
  - id: wlan_verbinden # OK auf der Tastatur: Netz + Passwort speichern, ESPHome verbindet sich neu
    then:
      - lambda: |-
          char ssid[65];
          lv_dropdown_get_selected_str(id(wlan_liste)->obj, ssid, sizeof(ssid));
          if (wifi::global_wifi_component->get_scan_result().empty()) return;
          wifi::global_wifi_component->save_wifi_sta(std::string(ssid), std::string(lv_textarea_get_text(id(wlan_passwort))));
          yellow::figur.nachricht(std::string("Ich probier's mit\n") + ssid + ".", false, 3);
      - lvgl.page.show: seite
  - id: aufwecken
    then:
      - lambda: id(wach_bis) = millis() + 30000;
      - script.execute: helligkeit
  - id: ansicht # Yellow oder Uhr, alle 3 s und bei Änderungen
    then:
      - lambda: |-
          if (!yellow::figur.bereit()) return; // Selects feuern schon vor LVGL (Bootschleife 24.10.2026)
          float v = id(ldr).state;
          bool dunkel = !std::isnan(v) && v >= ${ldr_dunkel};
          const std::string &m = id(ansicht_modus).current_option();
          // Auto und Yellow: Yellow, sobald Licht ist; im Dunkeln nie (dann nur die schwache Uhr beim Antippen)
          bool yellow = (!dunkel || id(weckmodus).state) && m != "Uhr";
          if (id(uhr_bis) != 0) {
            if ((int32_t) (millis() - id(uhr_bis)) < 0) yellow = false;
            else id(uhr_bis) = 0;
          }
          if (yellow) lv_obj_add_flag(id(uhr_ansicht), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(uhr_ansicht), LV_OBJ_FLAG_HIDDEN);
          yellow::figur.sichtbar(yellow);
          static bool war_dunkel = false;  // Licht geht an → Yellow erschrickt
          if (war_dunkel && !dunkel && yellow) yellow::figur.licht_schreck();
          if (!std::isnan(v)) war_dunkel = dunkel;
  - id: panel_zeigen # Panel kurz für Hilfe/Bestätigung, blendet sich selbst aus
    mode: restart
    parameters:
      sekunden: int
    then:
      - lvgl.widget.hide: zeilen
      - lvgl.widget.show: assist
      - delay: !lambda return sekunden * 1000;
      - lvgl.widget.hide: assist
      - lvgl.widget.show: zeilen
  - id: helligkeit
    then:
      - lambda: |-
          if (!id(auto_helligkeit).state) return;
          float v = id(ldr).state;
          bool dunkel = !std::isnan(v) && v >= ${ldr_dunkel};
          bool wach = millis() < id(wach_bis);
          float ziel; // im Dunkeln aus, angetippt nur die Uhr, ganz schwach
          if (dunkel) ziel = (wach || !id(nachts_aus).state) ? 0.05f : 0.0f;
          else ziel = wach ? 0.8f : 0.7f;
          float ist = id(backlight).current_values.is_on() ? id(backlight).current_values.get_brightness() : 0.0f;
          if (fabsf(ist - ziel) < 0.04f) return;
          if (ziel <= 0.0f) {
            id(backlight).turn_off().perform();
          } else {
            auto call = id(backlight).turn_on();
            call.set_brightness(ziel);
            call.perform();
          }

http_request:
  follow_redirects: false # eine Weiterleitung (z. B. 301 auf https) reicht als Lebenszeichen
  timeout: 5s

interval:
  - interval: 5s # Netzstatus: rot ohne WLAN, orange ohne MQTT (Text sagt, ob das Internet fehlt)
    then:
      - lambda: |-
          if (!yellow::figur.bereit()) return;
          static std::string letztes;  // zuletzt verbundenes Netz (wird nicht übertragen, nur der Name als Sensor)
          static uint32_t mqtt_weg_seit = 0;
          const bool wlan = wifi::global_wifi_component->is_connected();
          const bool mqtt_ok = mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected();
          if (wlan && !id(wlan_name).state.empty() && id(wlan_name).state != letztes) {
            if (!letztes.empty()) id(protokoll_merken).execute("wlan " + id(wlan_name).state);
            letztes = id(wlan_name).state;
          }
          if (mqtt_ok || !wlan) mqtt_weg_seit = 0;
          else if (mqtt_weg_seit == 0) mqtt_weg_seit = millis();
          // erst nach 30 s orange, damit ein kurzer Neuaufbau nicht blinkt
          const bool mqtt_weg = mqtt_weg_seit != 0 && millis() - mqtt_weg_seit > 30000;
          int stufe = !wlan ? 1 : !mqtt_weg ? 0 : id(internet_ok) ? 2 : 3;
          yellow::figur.netz(id(netz_test) ? id(netz_test) : stufe, letztes);
  - interval: 10s # WLAN-Dialog schließt sich 5 min nach der letzten Berührung (Wunsch Ottes)
    then:
      - if:
          condition:
            lambda: return lv_scr_act() == id(wlan_seite)->obj && (int32_t) (millis() - id(wach_bis)) > 270000;  // wach_bis = Berührung + 30 s
          then:
            - lvgl.page.show: seite
  - interval: 60s # Internet-Check nur, solange MQTT fehlt: jede HTTP-Antwort des Servers (auch 301) zählt
    then:
      - if:
          condition:
            lambda: |-
              return wifi::global_wifi_component->is_connected() &&
                     !(mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected());
          then:
            - http_request.get:
                url: ${internet_check_url}
                capture_response: false
                on_response:
                  then:
                    - lambda: id(internet_ok) = true;
                on_error:
                  then:
                    - lambda: id(internet_ok) = false;
  - interval: 3s
    then:
      - script.execute: helligkeit
      - script.execute: ansicht
  - interval: 50ms
    then:
      - lambda: yellow::figur.tick();

