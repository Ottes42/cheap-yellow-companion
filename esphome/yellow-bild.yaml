# Yellow – optionales Paket „Bilder“: pixelgenaue Screenshots und GIFs ohne Kamera (für Doku und Fotos).
# Nur zum Fotografieren einbinden, danach wieder weglassen. Kosten: ~60 Byte RAM, ~1 KB Flash, kein Bildpuffer –
# jeder LVGL-Flush schickt seinen Streifen (RGB565) während der Aufnahme nach yellow/<gerät>/bild/x/y/b/h.
# Befehl: {"aktion": "bild", "sekunden": 0} (ein Bild) bzw. > 0 (Bildfolge). Empfänger: tools/bild.py
globals:
  - id: bild_bis # bis dahin schickt jeder LVGL-Flush seine Pixel nach yellow/<gerät>/bild/x/y/b/h (RGB565)
    type: uint32_t
    initial_value: "0"

mqtt:
  on_json_message:
    - topic: yellow/${geraet}/befehl
      then:
        - if:
            condition:
              lambda: return std::string(x["aktion"] | "") == "bild";
            then:
              - script.execute:
                  id: bild_aufnehmen
                  sekunden: !lambda return x["sekunden"] | 0;

script:
  - id: bild_aufnehmen # Screenshot (sekunden 0) oder Bildfolge für GIFs; Empfänger: tools/bild.py
    parameters:
      sekunden: int
    then:
      - lambda: |-
          static bool eingehaengt = false;
          if (!eingehaengt) {  // eigenen Flush davor hängen, ESPHome zeichnet danach wie gewohnt
            eingehaengt = true;
            lv_display_set_flush_cb(lv_display_get_default(), [](lv_display_t *d, const lv_area_t *a, uint8_t *px) {
              if (id(bild_bis) && (int32_t) (millis() - id(bild_bis)) < 0 && mqtt::global_mqtt_client->is_connected()) {
                const int b = a->x2 - a->x1 + 1, h = a->y2 - a->y1 + 1;
                for (int y = 0; y < h; y += 20) {  // in Streifen von 20 Zeilen (≤ 13 KB je Nachricht)
                  const int n = std::min(20, h - y);
                  char topic[64];
                  snprintf(topic, sizeof(topic), "yellow/${geraet}/bild/%d/%d/%d/%d", (int) a->x1, (int) (a->y1 + y), b, n);
                  mqtt::global_mqtt_client->publish(topic, (const char *) px + y * b * 2, b * n * 2);
                }
              }
              esphome::lvgl::LvglComponent::static_flush_cb(d, a, px);
            });
          }
          id(bild_bis) = millis() + (sekunden > 0 ? sekunden * 1000 : 4000);  // ein Bild: 4 s reichen für alle Streifen
          lv_obj_invalidate(lv_screen_active());
