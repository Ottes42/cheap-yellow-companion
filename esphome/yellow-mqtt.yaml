# Yellow – MQTT (both profiles): commands, data and events under yellow/${device}/…
# Commands: JSON to yellow/${device}/command, {"action": …} plus the fields of the action
#   (message: text/wait/seconds, love_letter: text, expression, prop, decor_test: occasion, effect: name, …).
# Data (retained, from HA or the server): yellow/${device}/data/<occasion|alarm|appointment|notice|weather|
#   weather_condition|outdoor_temp|room_temp|room_humidity>, events without retain: data/doorbell, data/nabu_ring.
# Events from the device: JSON to yellow/${device}/event (type read/answer/game/petted/timer_off).
# Status: yellow/${device}/status online/offline (retained, last will). The profile sets broker and TLS.
mqtt:
  username: ${mqtt_user}
  password: ${mqtt_password}
  client_id: ${mqtt_user}
  topic_prefix: yellow/${device}
  discovery: false
  log_topic: null
  reboot_timeout: 0s
  keepalive: 120s
  birth_message:
    topic: yellow/${device}/status
    payload: online
    retain: true
  will_message:
    topic: yellow/${device}/status
    payload: offline
    retain: true
  on_connect:
    - script.execute: send_telemetry
  on_json_message:
    - topic: yellow/${device}/command
      then:
        - lambda: |-
            const std::string a = x["action"] | "";
            auto s = [&](const char *k) { return std::string(x[k] | ""); };
            const int sec = x["seconds"] | 0;
            const bool on = x["on"] | false;
            auto &f = yellow::companion;
            if (a == "message") f.message(s("text"), x["wait"] | false, x["seconds"] | 4);
            else if (a == "love_letter") f.message(std::string(yellow::LOVE_PREFIX) + s("text"), true, 5);
            else if (a == "expression") f.set_expression(s("expression"), sec);
            else if (a == "prop") f.prop(s("prop"), sec);
            else if (a == "decor_test") f.decor_test(s("occasion"));
            else if (a == "effect") f.effect(s("name"), sec);
            else if (a == "boredom_test") f.boredom_test(x["minutes"] | 0);
            else if (a == "away") f.away(on, s("card"));
            else if (a == "matrix") f.matrix(sec);
            else if (a == "network_test") id(network_test) = x["level"] | (on ? 1 : 0);
            else if (a == "weather") f.weather_test(s("condition"));
            else if (a == "jewelry") f.jewelry(on);
            else if (a == "accessory") f.accessory(s("name"));
            else if (a == "game") f.game(s("game"));
            else if (a == "question") f.question(s("question"), s("options"));
            else if (a == "timer") f.timer(sec, s("name"));
            else if (a == "gesture") f.gesture(s("gesture"));
            else if (a == "look") f.look(s("direction"));
            else if (a == "nabu_direction") f.nabu_direction(s("direction"));
            else if (a == "sleep") f.sleep(on);
            else if (a == "telemetry") id(send_telemetry).execute();
            else if (a == "wifi_dialog") id(open_wifi).execute();  // for testing without tapping
            else if (a != "image") ESP_LOGW("yellow", "unknown action: %s", a.c_str());  // image: yellow-screenshot.yaml

# Telemetry (retained) on connect and every 30 min: sign of life, state and the collected activity log
script:
  - id: send_telemetry
    then:
      - lambda: |-
          if (mqtt::global_mqtt_client == nullptr || !mqtt::global_mqtt_client->is_connected()) return;
          float light = id(ldr).state;
          bool ok = mqtt::global_mqtt_client->publish_json("yellow/${device}/telemetry", [light](JsonObject r) {
            r["firmware"] = ESPHOME_VERSION " " __DATE__ " " __TIME__;
            r["uptime_s"] = millis() / 1000;
            r["reset_reason"] = id(reset_reason).state;
            r["free"] = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);  // same as the memory sensors
            r["block"] = heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL);
            r["wifi"] = id(wifi_name).state;
            r["rssi"] = wifi::global_wifi_component->wifi_rssi();
            r["dark"] = !std::isnan(light) && light >= ${ldr_dark};
            r["view"] = lv_obj_has_flag(id(clock_view), LV_OBJ_FLAG_HIDDEN) ? "yellow" : "clock";
            r["character"] = id(character).current_option();
            r["today"] = yellow::companion.counts_text();  // taps|pets|games|fist
            JsonArray p = r["log"].to<JsonArray>();
            for (auto &e : id(activity_log)) p.add(e);
          }, 1, true);
          ESP_LOGI("yellow", "Telemetry %s (%u entries)", ok ? "sent" : "failed", (unsigned) id(activity_log).size());
          if (ok) id(activity_log).clear();

interval:
  - interval: 30min
    then:
      - script.execute: send_telemetry

text_sensor:
  - platform: mqtt_subscribe # remote sayings list (retained, lines; "-" = none)
    id: ha_sayings
    topic: yellow/${device}/data/sayings
    on_value:
      - lambda: |-
          std::string t = x.substr(0, 599);
          yellow::companion.remote_sayings(t);
          auto &g = id(sayings_saved);
          if (t != g.data()) {  // write to flash only on change
            g.fill(0);
            t.copy(g.data(), 599);
          }
  - platform: mqtt_subscribe # today's occasion for the decoration
    id: ha_occasion
    topic: yellow/${device}/data/occasion
    on_value:
      - lambda: 'yellow::companion.occasion(x == "unknown" || x == "unavailable" ? std::string("") : x);'
  - platform: mqtt_subscribe
    id: ha_alarm
    topic: yellow/${device}/data/alarm
    on_value:
      - script.execute: draw_rows
  - platform: mqtt_subscribe
    id: ha_appointment
    topic: yellow/${device}/data/appointment
    on_value:
      - script.execute: draw_rows
  - platform: mqtt_subscribe
    id: ha_notice
    topic: yellow/${device}/data/notice
    on_value:
      - script.execute: draw_rows
  - platform: mqtt_subscribe
    id: ha_weather
    topic: yellow/${device}/data/weather
    on_value:
      - script.execute: draw_weather
  - platform: mqtt_subscribe
    id: ha_weather_condition
    topic: yellow/${device}/data/weather_condition
    on_value:
      - script.execute: draw_weather
  - platform: mqtt_subscribe # doorbell (event "on"): doorbell panel for 60 s, no reaction in the dark
    id: doorbell_event
    topic: yellow/${device}/data/doorbell
    on_value:
      - if:
          condition:
            lambda: |-
              float v = id(ldr).state;
              return x == "on" && (std::isnan(v) || v < ${ldr_dark});
          then:
            - lambda: yellow::companion.doorbell();
            - lvgl.label.update:
                id: lbl_in
                text: "\U000F009E  ${t_doorbell}"
            - lvgl.label.update:
                id: lbl_out
                text: !lambda |-
                  auto t = id(ha_time).now();
                  return t.is_valid() ? str_sprintf(yellow::txt::AT_THE_DOOR_TIME, t.hour, t.minute) : std::string(yellow::txt::AT_THE_DOOR);
            - script.execute:
                id: show_panel
                seconds: 60
            - script.execute: wake_display

sensor:
  - platform: mqtt_subscribe
    id: climate_temp
    topic: yellow/${device}/data/room_temp
    on_value:
      - script.execute: draw_climate
  - platform: mqtt_subscribe
    id: climate_humidity
    topic: yellow/${device}/data/room_humidity
    on_value:
      - script.execute: draw_climate
  - platform: mqtt_subscribe
    id: outdoor_temp
    topic: yellow/${device}/data/outdoor_temp
    on_value:
      - script.execute: draw_climate
