# Feature "with a voice assistant" (Nabu) for Yellow: Yellow looks at Nabu's LED ring (jealous/curious) and knows where Nabu stands.
# Include in the device under packages:. Without this package Yellow runs normally; Nabu's ring (data/nabu_ring), the
# direction (command nabu_direction), visits and banter come from HA (see docs/nabu.md).

text_sensor:
  - platform: mqtt_subscribe # Nabu's LED ring goes on (event from HA): Yellow looks over, jealous or curious
    id: nabu_ring
    topic: yellow/${device}/data/nabu_ring
    on_value:
      - lambda: if (x == "on") yellow::companion.nabu_ring();
