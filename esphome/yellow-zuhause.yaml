# Yellow – Profil „Zuhause“: lokaler Mosquitto (ohne TLS), Zeit von HA, ESPHome-API für OTA, Logs und die nativen
# Entitäten. Daten, Befehle und Ereignisse laufen wie unterwegs über MQTT (yellow-mqtt.yaml).
mqtt:
  broker: ${mqtt_broker}
  port: 1883

api:

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: /1
        then:
          - script.execute: uhr_zeichnen
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: yellow::figur.neuer_tag();
    on_time_sync:
      - script.execute: uhr_zeichnen
