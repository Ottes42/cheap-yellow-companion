blueprint:
  name: Yellow – send data (weather, alarm, appointment, climate)
  description: >-
    Sends the data Yellow shows in his clock view and weather to `yellow/<device>/daten/…` (retained): weather text and
    condition from a weather entity (today, from 14:00 tomorrow), next alarm, next appointment of the day, a free hint,
    outdoor and room temperature, room humidity. Runs every 10 minutes, at Home Assistant start and as soon as the
    device comes online. Leave optional inputs empty to hide that line.
  domain: automation
  source_url: https://github.com/Ottes42/cheap-yellow-companion/blob/main/homeassistant/blueprints/automation/yellow_daten.yaml
  input:
    geraet:
      name: Device
      description: The `geraet` substitution of the device (MQTT topics yellow/<device>/…)
      default: yellow
      selector:
        text:
    wetter:
      name: Weather
      selector:
        entity:
          domain: weather
    wecker:
      name: Next alarm (optional)
      description: Timestamp sensor, e.g. the phone's next alarm from the mobile app
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: timestamp
    kalender:
      name: Calendar (optional)
      description: Next appointment of today
      default: ""
      selector:
        entity:
          domain: calendar
    hinweis:
      name: Hint (optional)
      description: Any entity whose state is shown as an extra line (e.g. waste collection); "-" or empty hides it
      default: ""
      selector:
        entity:
    aussen_temp:
      name: Outdoor temperature (optional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature
    raum_temp:
      name: Room temperature (optional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature
    raum_feuchte:
      name: Room humidity (optional)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: humidity

mode: queued
max: 5

trigger_variables:
  geraet: !input geraet

triggers:
  - trigger: time_pattern
    minutes: /10
  - trigger: homeassistant
    event: start
  - trigger: mqtt
    topic: "yellow/{{ geraet }}/status"
    payload: online

variables:
  wetter: !input wetter
  wecker: !input wecker
  kalender: !input kalender
  hinweis: !input hinweis
  aussen_temp: !input aussen_temp
  raum_temp: !input raum_temp
  raum_feuchte: !input raum_feuchte

actions:
  - action: weather.get_forecasts
    target:
      entity_id: "{{ wetter }}"
    data:
      type: daily
    response_variable: vorhersage
  - if: "{{ kalender != '' }}"
    then:
      - action: calendar.get_events
        target:
          entity_id: "{{ kalender }}"
        data:
          start_date_time: "{{ now().isoformat() }}"
          end_date_time: "{{ today_at('23:59').isoformat() }}"
        response_variable: termine
  - variables:
      tage: "{{ vorhersage[wetter].forecast | default([]) }}"
      tag: "{{ tage[1] if now().hour >= 14 and tage | count > 1 else (tage[0] if tage else {}) }}"
      wetter_text: >-
        {% if tag %}{{ 'Morgen' if now().hour >= 14 else 'Heute' }}
        {{ tag.templow | default(tag.temperature) | round(0) | int }}–{{ tag.temperature | round(0) | int }}°{% else %}-{% endif %}
      ereignisse: "{{ (termine[kalender].events if termine is defined else []) | default([]) }}"
      daten:
        wetter: "{{ wetter_text }}"
        wetter_lage: "{{ tag.condition | default('') }}"
        wecker: >-
          {% set w = states(wecker) | as_datetime(none) if wecker else none %}
          {{ 'Wecker ' ~ as_local(w).strftime('%H:%M') if w and now() < w < now() + timedelta(hours=20) else '-' }}
        termin: >-
          {% set e = ereignisse | first if ereignisse else none %}
          {{ (as_local(as_datetime(e.start)).strftime('%H:%M ') if 'T' in e.start else '') ~ e.summary if e else '-' }}
        hinweis: "{{ states(hinweis) if hinweis and states(hinweis) not in ['unknown', 'unavailable', ''] else '-' }}"
        aussen_temp: "{{ states(aussen_temp) if aussen_temp else '' }}"
        raum_temp: "{{ states(raum_temp) if raum_temp else '' }}"
        raum_feuchte: "{{ states(raum_feuchte) if raum_feuchte else '' }}"
  - repeat:
      for_each: "{{ daten | dictsort | rejectattr(1, 'eq', '') | list }}" # leere (nicht gewählte) Werte nicht senden
      sequence:
        - action: mqtt.publish
          data:
            topic: "yellow/{{ geraet }}/daten/{{ repeat.item[0] }}"
            payload: "{{ repeat.item[1] }}"
            retain: true
