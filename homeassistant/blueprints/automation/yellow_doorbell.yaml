blueprint:
  name: Yellow – doorbell
  description: >-
    When the doorbell rings, Yellow shows a doorbell panel for 60 s and reacts (only when the room is lit).
    Sends `on` to `yellow/<device>/data/doorbell` (not retained).
  domain: automation
  source_url: https://github.com/Ottes42/cheap-yellow-companion/blob/main/homeassistant/blueprints/automation/yellow_doorbell.yaml
  input:
    device:
      name: Device
      default: yellow
      selector:
        text:
    doorbell:
      name: Doorbell
      description: Binary sensor that turns on when someone rings
      selector:
        entity:
          domain: binary_sensor

mode: single
max_exceeded: silent

variables:
  device: !input device

triggers:
  - trigger: state
    entity_id: !input doorbell
    to: "on"

actions:
  - action: mqtt.publish
    data:
      topic: "yellow/{{ device }}/data/doorbell"
      payload: "on"
